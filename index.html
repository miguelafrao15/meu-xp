<title>MEU-XP - ReactOS 0.4.16</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial}
body{background:#000;color:#fff;display:flex;flex-direction:column;height:100vh}
header{background:#0a3d8a;padding:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:16px}
#controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=file]{max-width:180px;font-size:12px}
button{background:#2d7d46;color:#fff;border:0;padding:10px 18px;border-radius:8px;font-weight:700}
button:active{transform:scale(.97)}
#status{font-size:12px;opacity:.8;padding:4px 10px}
#screen_container{flex:1;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#screen_container canvas{max-width:100%;max-height:100%;image-rendering:pixelated}

#log{height:90px;background:#111;font-size:11px;overflow:auto;padding:6px;white-space:pre-wrap}
</style>
<script src="./build/libv86.js"></script>
</head>
<body>
<header>
<h1>MEU-XP</h1>
<div id="controls">
<input type="file" id="iso" accept=".iso">
<button id="start">LIGAR</button>
<button id="reset" style="background:#555">Reset</button>
</div>
</header>
<div id="status">1. Escolha a ISO ReactOS-0.4.16-i386.iso (388MB) em emulated/0/meu-xp -> 2. Clique LIGAR</div>
<div id="screen_container"><div id="screen"></div></div>
<div id="log"></div>
<script>
const status=document.querySelector("#status");
const logEl=document.querySelector("#log");
const isoInput=document.querySelector("#iso");
let emulator=null;let isoBuffer=null;
function log(m){logEl.textContent+=m+"\n";logEl.scrollTop=logEl.scrollHeight;}
isoInput.addEventListener("change", async e=>{
  const file=e.target.files[0];
  if(!file){status.textContent="Nenhuma ISO";return;}
  status.textContent=`Lendo ${file.name} ${(file.size/1024/1024).toFixed(1)}MB...`;
  log(`Lendo ${file.name}...`);
  const ab=await file.arrayBuffer();
  isoBuffer=ab;
  status.textContent=`ISO carregada: ${file.name} - Clique LIGAR`;
  log(`ISO OK: ${ab.byteLength} bytes`);
});
document.querySelector("#start").onclick=()=>{
  if(!isoBuffer){status.textContent="Selecione a ISO primeiro!";log("ERRO: selecione ISO");return;}
  if(emulator){try{emulator.stop();}catch(e){}}
  document.querySelector("#screen").innerHTML="";
  logEl.textContent="";
  log("Iniciando v86...");
  status.textContent="Iniciando...";
  emulator=new V86Starter({
    wasm_path:"./build/v86.wasm",
    memory_size:512*1024*1024,
    vga_memory_size:8*1024*1024,
    screen_container:document.getElementById("screen"),
    bios:{url:"./bios/seabios.bin"},
    vga_bios:{url:"./bios/vgabios.bin"},
    cdrom:{buffer:isoBuffer},
    autostart:true,
  });
  emulator.add_listener("emulator-ready",()=>{log("Pronto - bootando ISO");status.textContent="Bootando ReactOS...";});
};
document.querySelector("#reset").onclick=()=>{if(emulator){emulator.restart();log("Reset");}};
log("OK build/libv86.js 351KB | v86.wasm 1.91MB | seabios 128KB | vgabios 35.5KB");
log("100% offline, sem copy.sh. Funciona no GitHub Pages e localhost.");
</script>
