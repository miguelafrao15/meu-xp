<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ReactOS no Poco X3 - GitHub Pages Final</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#000;color:#fff;font-family:Consolas,monospace;display:flex;flex-direction:column;height:100vh;height:100dvh}
  header{background:#0a2a5e;padding:10px;display:flex;flex-direction:column;gap:8px}
  h1{font-size:12px;margin:0}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  .btn{background:#d4d0c8;color:#000;border:2px outset #fff;padding:12px;font-weight:700;font-size:12px;flex:1;min-width:80px}
  .btn.primary{background:#00a;color:#fff} .btn:active{border-style:inset}
  #screen_container{flex:1;background:#000;position:relative;display:flex;align-items:center;justify-content:center}
  #screen_container canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
  #status{padding:6px;background:#111;color:#0f0;font-size:10px}
  #log{height:50px;background:#000;color:#0a0;font-size:9px;overflow:auto;border-top:1px solid #222;padding:4px}
  progress{width:100%;height:10px}
</style>
</head>
<body>
<header>
  <h1>ReactOS 0.4.16 - miguelafrao15/meu-xp - Poco X3</h1>
  <div class="row">
    <button class="btn primary" id="startBtn">▶ LIGAR 256MB</button>
    <button class="btn" id="stopBtn">■ Parar</button>
    <button class="btn" id="kbdBtn">⌨️ Teclado</button>
    <button class="btn" id="cadBtn">Ctrl+Alt+Del</button>
  </div>
  <progress id="prog" value="0" max="100" style="display:none"></progress>
</header>

<div id="screen_container"><div id="screen"></div><canvas id="vga"></canvas></div>
<div id="status">Pronto para bootar do seu Release</div>
<div id="log"></div>
<input type="text" id="hidden" style="position:absolute;left:-9999px">

<script src="https://copy.sh/v86/build/libv86.js"></script>
<script>
let emulator=null;
const $=id=>document.getElementById(id);
const log=m=>{ const l=$("log"); l.textContent+=m+"\n"; l.scrollTop=l.scrollHeight; };
const setStatus=s=>$("status").textContent=s;

function getCfg(){
  return {
    wasm_path:"https://copy.sh/v86/build/v86.wasm",
    memory_size:256*1024*1024,
    vga_memory_size:8*1024*1024,
    screen_container:$("screen_container"),
    bios:{url:"https://copy.sh/v86/bios/seabios.bin"},
    vga_bios:{url:"https://copy.sh/v86/bios/vgabios.bin"},
    // LINK DO SEU RELEASE - depois que criar o Release v1
    cdrom:{url:"https://github.com/miguelafrao15/meu-xp/releases/download/v1/ReactOS-0.4.16-i386.iso"},
    acpi:true, autostart:true,
  };
}

$("startBtn").onclick=()=>{
  if(emulator){ try{emulator.stop();}catch{} }
  $("prog").style.display="block";
  setStatus("Baixando ISO do seu GitHub (388MB) - no 4G demora 2-3min no Poco");
  log("Baixando de releases/download/v1/ReactOS-0.4.16-i386.iso");
  $("screen").innerHTML="";
  try{
    emulator=new V86Starter(getCfg());
    emulator.add_listener("emulator-ready", ()=>{
      setStatus("LIGADO! No menu do ReactOS escolha 'Live CD'");
      $("prog").style.display="none";
      log("Se aparecer 'Boot failed' é porque o Release ainda não foi criado");
    });
    emulator.add_listener("download-progress", e=>{
      if(e.total){
        const p=Math.round(e.loaded/e.total*100);
        $("prog").value=p;
        setStatus(`Baixando ISO: ${p}% - ${(e.loaded/1024/1024).toFixed(1)}MB`);
      }
    });
    emulator.add_listener("download-error", e=>{
      log(`ERRO ${e.file_name}: ${e.msg}`);
      setStatus("Erro 404 - Você ainda não criou o Release v1 com a ISO");
      $("prog").style.display="none";
    });
  }catch(err){ log("ERRO: "+err.message); }
};

$("stopBtn").onclick=()=>{ if(emulator) emulator.stop(); setStatus("Parado"); };
$("kbdBtn").onclick=()=>$("hidden").focus();
$("hidden").addEventListener("input", e=>{
  if(emulator && e.target.value){
    emulator.keyboard_send_text(e.target.value.slice(-1));
    e.target.value="";
  }
});
$("cadBtn").onclick=()=>{ if(emulator) emulator.keyboard_send_scancodes([0x1D,0x38,0x53]); };

log("Arquivo final para miguelafrao15/meu-xp - aponte para Release v1");
</script>
</body>
</html>
