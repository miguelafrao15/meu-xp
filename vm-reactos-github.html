<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ReactOS no GitHub Pages - Poco X3</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#000;color:#fff;font-family:Consolas,monospace;display:flex;flex-direction:column;height:100vh;height:100dvh}
  header{background:#0a2a5e;padding:10px;display:flex;flex-direction:column;gap:8px}
  h1{font-size:12px;margin:0}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  .btn{background:#d4d0c8;color:#000;border:2px outset #fff;padding:10px 12px;font-weight:700;font-size:11px;flex:1;min-width:80px}
  .btn.primary{background:#00a;color:#fff}
  #screen_container{flex:1;background:#000;position:relative;display:flex;align-items:center;justify-content:center}
  #screen_container canvas{width:100%;height:100%;object-fit:contain}
  #status{padding:6px;background:#111;color:#0f0;font-size:10px}
  #log{height:50px;background:#000;color:#0a0;font-size:9px;overflow:auto;border-top:1px solid #222;padding:4px}
  progress{width:100%;height:8px}
  code{background:#222;padding:2px 4px;font-size:10px}
</style>
</head>
<body>
<header>
  <h1>ReactOS 0.4.16 no Navegador - GitHub Pages</h1>
  <div class="row">
    <button class="btn primary" id="startBtn">▶ LIGAR ReactOS (256MB)</button>
    <button class="btn" id="stopBtn">■ Parar</button>
    <button class="btn" id="kbdBtn">⌨️ Teclado</button>
  </div>
  <progress id="prog" value="0" max="100" style="display:none"></progress>
  <div style="font-size:10px;color:#ccc">Para GitHub: troque a linha <code>cdrom url</code> no código para o link do seu Release</div>
</header>

<div id="screen_container"><div id="screen"></div><canvas id="vga"></canvas></div>
<div id="status">Pronto. No GitHub Pages esse arquivo vai bootar o ReactOS.iso via Releases.</div>
<div id="log"></div>
<input type="text" id="hidden" style="position:absolute;left:-9999px">

<script src="https://copy.sh/v86/build/libv86.js"></script>
<script>
let emulator=null;
const $=id=>document.getElementById(id);
const log=m=>{ const l=$("log"); l.textContent+=m+"\n"; l.scrollTop=l.scrollHeight; };
const setStatus=s=>$("status").textContent=s;

function getCfg(){
  // 👇👇👇 AQUI VOCÊ VAI COLOCAR O LINK DO SEU RELEASE DEPOIS
  // Exemplo: "https://github.com/SEUUSER/meu-xp/releases/download/v1/ReactOS-0.4.16-i386.iso"
  // Por enquanto usa arquivo local ./ReactOS-0.4.16-i386.iso
  return {
    wasm_path:"https://copy.sh/v86/build/v86.wasm",
    memory_size:256*1024*1024,
    vga_memory_size:8*1024*1024,
    screen_container:$("screen_container"),
    bios:{url:"https://copy.sh/v86/bios/seabios.bin"},
    vga_bios:{url:"https://copy.sh/v86/bios/vgabios.bin"},
    cdrom:{url:"./ReactOS-0.4.16-i386.iso"}, // <- CDROM, não HDA
    acpi:true, autostart:true,
  };
}

$("startBtn").onclick=()=>{
  if(emulator){ try{emulator.stop();}catch{} }
  $("prog").style.display="block";
  setStatus("Baixando ReactOS... 388MB, no 4G demora 2-3min");
  log("Iniciando ReactOS 0.4.16 - Live ISO");
  $("screen").innerHTML="";
  try{
    emulator=new V86Starter(getCfg());
    emulator.add_listener("emulator-ready", ()=>{
      setStatus("ReactOS LIGADO! Toque na tela, use teclado");
      $("prog").style.display="none";
      log("Boot iniciado. ReactOS vai mostrar menu - escolha 'Live CD'");
    });
    emulator.add_listener("download-progress", e=>{
      if(e.total) $("prog").value=Math.round(e.loaded/e.total*100);
    });
    emulator.add_listener("download-error", e=>{
      log(`ERRO ${e.file_name}: ${e.msg}`);
      setStatus(`Erro: ${e.file_name} não encontrado. No GitHub, tem que usar Releases`);
      $("prog").style.display="none";
    });
  }catch(err){ log("ERRO: "+err.message); }
};

$("stopBtn").onclick=()=>{ if(emulator) emulator.stop(); setStatus("Parado"); };
$("kbdBtn").onclick=()=>{ $("hidden").focus(); };
$("hidden").addEventListener("input", e=>{
  if(emulator && e.target.value){
    emulator.keyboard_send_text(e.target.value.slice(-1));
    e.target.value="";
  }
});

log("Versão GitHub: este arquivo espera ReactOS-0.4.16-i386.iso na mesma pasta ou via link de Release");
</script>
</body>
</html>
